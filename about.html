<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
</head>
<body>
    <header>
        <h1>The About Page</h1>
    </header>
    <nav aria-label="Main navigation">
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./table.html">Table</a></li>
            <li><a href="./about.html" aria-current="page">About</a></li>
        </ul>
    </nav>
    <section>
        <h2>Tell Us About Yourself</h2>
        <form method="POST" action="https://webdevbasics.net/scripts/demo.php">
            <div>
                <label for="myName">Name:</label>
                <input type="text" name="myName" id="myName">
            </div>
            <div>
                <label for="myEmail">Email:</label>
                <input type="email" name="myEmail" id="myEmail">
            </div>
            <div>
                <p>Choose the browsers you use:</p>
                <input type="checkbox" name="Chrome" id="Chrome" value="Yes">
                <label for="Chrome">Google Chrome</label>
                <input type="checkbox" name="Firefox" id="Firefox" value="Yes">
                <label for="Firefox">Firefox</label>
                <input type="checkbox" name="Edge" id="Edge" value="Yes">
                <label for="Edge">Microsoft Edge</label>
            </div>
            <div>
                <p>Would you like to be on our mailing list?</p>
                <div>
                    <input type="radio" name="mailingList" id="mailingListYes" value="Yes">
                    <label for="mailingListYes">Yes</label>
                </div>
                <div>
                    <input type="radio" name="mailingList" id="mailingListNo" value="No">
                    <label for="mailingListNo">No</label>
                </div>
            </div>
            <div>
                <label for="comments">Comments:</label>
                <textarea name="comments" id="comments" rows="4" cols="40"></textarea>
            </div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </section>
    <section>
        <h2>About This Website</h2>
        <p>This is Justin Cobb's vacation website, created to practice HTML navigation, lists, and tables.</p>
    </section>
    <footer>
        <p>Copyright &copy; 2026 Justin Cobb</p>
    </footer>
</body>
</html>
